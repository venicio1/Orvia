services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orvia
      POSTGRES_USER: orvia
      POSTGRES_PASSWORD: orvia_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - orvia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orvia -d orvia"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - orvia-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  orvia-postgres:
  orvia-redis:
